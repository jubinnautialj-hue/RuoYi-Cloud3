# Tomcat
server:
  port: 9308

# Spring
spring:
  application:
    # 应用名称
    name: ruoyi-flowable
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}

# 允许 Bean 定义覆盖（解决 MyBatis-Plus 和其他组件的 Bean 冲突问题）
spring.main:
  allow-bean-definition-overriding: true
